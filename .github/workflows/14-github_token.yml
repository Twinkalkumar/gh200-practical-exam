name: 14 github token

on:
    push:

permissions:
    contents: read
    issues: write

jobs:
    create-issue:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/github-script@v7
              with:
                script: |
                 await github.rest.issues.create
                 ({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    title: 'Automated GH-200 issue',
                    body: 'Created using GITHUB_TOKEN'
                 })