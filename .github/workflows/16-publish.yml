name: 16 publish github package

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: read
    packages: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 22
                registry-url: https://npm.pkg.github.com
                scope: '@twinkalkumar'
            
            - name: Install dependencies
              run: npm install

            - name: Publish package
              run: npm publish
              env:
                Node_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}