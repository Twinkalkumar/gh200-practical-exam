name: 18 github publish

on:
    workflow_dispatch:

permissions:
    contents: read
    packages: write
    builds: write

jobs:
    build-publish:
      runs-on: ubuntu-latest
      steps:
        - uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
        - uses: docker/build-push-action@v6
          with:
            push: true
            tags: ghcr.io/twinkal/gh200-app:${{ github.sha }}