name: expressions-demo

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      version:
        description: "Application version"
        required: true
        default: "1.0.0"

      environment:
        description: "Target environment"
        required: true
        default: "dev"

jobs:
  demo:
    runs-on: ubuntu-latest

    steps:
      - name: Show branch
        run: echo "Current branch is ${{ github.ref }}"

      - name: Show commit message
        run: echo "${{ github.event.head_commit.message }}"

      - name: Check if commit contains [skip deploy]
        run: |
          echo "Contains skip deploy? ${{ contains(github.event.head_commit.message, '[skip deploy]') }}"

      - name: Check if this is a tag
        run: |
          echo "Is tag? ${{ startsWith(github.ref, 'refs/tags/') }}"

      - name: Format output
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "${{ format('Deploying {0} to {1}', inputs.version, inputs.environment) }}"

      - name: Read JSON value
        run: |
          echo "Enabled = ${{ fromJSON('{"enabled":true}').enabled }}"

      # Challenge: Skip deployment if commit message contains [skip deploy]
      - name: Deploy Application
        if: ${{ !contains(github.event.head_commit.message, '[skip deploy]') }}
        run: |
          echo "Deploying application..."

      - name: Deployment Skipped
        if: ${{ contains(github.event.head_commit.message, '[skip deploy]') }}
        run: |
          echo "Deployment skipped because commit message contains [skip deploy]"